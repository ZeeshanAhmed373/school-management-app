<!DOCTYPE html>
<html><body>
<canvas id="c" width="512" height="512"></canvas><br/>
<a id="dl" download="icon-512.png" href="#">Click Here to Download icon-512.png</a>
<script>
const c = document.getElementById('c'), x = c.getContext('2d');
const g = x.createLinearGradient(0, 0, 512, 512);
g.addColorStop(0, '#0284c7'); g.addColorStop(1, '#0d9488');
x.fillStyle = g; x.fillRect(0, 0, 512, 512);
x.fillStyle = '#fff'; x.font = 'bold 220px sans-serif';
x.textAlign = 'center'; x.textBaseline = 'middle';
x.fillText('🎓', 256, 270);
document.getElementById('dl').href = c.toDataURL('image/png');
</script>
</body></html>
